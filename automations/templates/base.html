<!DOCTYPE html>
<html lang="en" {% if dark_mode %}data-theme="dark"{% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Automations{% endblock %}</title>
    {% load static %}
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon-192.png' %}">
    <link rel="apple-touch-icon" href="{% static 'favicon-192.png' %}">
    <meta name="msapplication-TileImage" content="{% static 'favicon-192.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Theme variables ── */
        :root {
            /* Palette from HOME-The-process: midnight sky + teal-blue */
            --bg: #f4f6f9;                   /* soft sky wash */
            --surface: #ffffff;
            --surface2: #eef2f6;
            --border: #d8dfe6;
            --text-primary: #1a2838;         /* midnight navy */
            --text-secondary: #526070;
            --text-muted: #8d9aa7;
            --accent: #2d6b86;               /* sky-teal blue from image */
            --accent-hover: #1f5670;
            --accent-soft: #d9e6ec;
            --sidebar-bg: #1a2838;
            --sidebar-text: #e9eef4;
            --sidebar-text-muted: #9aa7b5;
            --sidebar-hover: rgba(255,255,255,0.08);
            --sidebar-active: rgba(90,163,194,0.32);
            --sidebar-active-border: #7fc0dd;
            --sidebar-active-text: #ffffff;
            --suiteheader-bg: #1a2838;
        }
        [data-theme="dark"] {
            --bg: #0b1017;
            --surface: #152131;
            --surface2: #1f2d3f;
            --border: #2d3f54;
            --text-primary: #e9eef4;
            --text-secondary: #bfc5cf;
            --text-muted: #6f7d8d;
            --accent: #5aa3c2;
            --accent-hover: #7fbcd7;
            --accent-soft: rgba(90,163,194,0.18);
            --sidebar-bg: #0b1017;
            --sidebar-text: #e9eef4;
            --sidebar-text-muted: #8d9aa7;
            --sidebar-hover: rgba(255,255,255,0.06);
            --sidebar-active: rgba(127,192,221,0.22);
            --sidebar-active-border: #7fc0dd;
            --sidebar-active-text: #ffffff;
            --suiteheader-bg: #0b1017;
        }

        /* Ambient background — HOME-The-process image, clearly visible */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(244,246,249,0.55), rgba(244,246,249,0.70)),
                url('/static/HOME-The-process.png') center/cover no-repeat;
            background-attachment: fixed;
            pointer-events: none;
        }
        [data-theme="dark"] body::before {
            background:
                linear-gradient(rgba(11,16,23,0.72), rgba(11,16,23,0.82)),
                url('/static/HOME-The-process.png') center/cover no-repeat;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* SharePoint-style Sidebar */
        .sidebar {
            width: 48px;
            background: var(--sidebar-bg);
            transition: width 0.2s ease, background 0.3s ease;
            min-height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 0;
            box-shadow: 1px 0 0 rgba(0,0,0,0.05);
        }

        .sidebar:hover {
            width: 228px;
            box-shadow: 2px 0 14px rgba(0,0,0,0.08);
        }

        /* Header with SharePoint accent strip */
        .sidebar-header {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            min-height: 48px;
            background: #1a2838;
        }
        .sidebar-header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #2d6b86 0%, #5aa3c2 100%);
        }

        .sidebar-brand-wrap {
            margin-left: 8px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-brand-wrap { opacity: 1; }

        .sidebar-brand-one-line {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        /* Legacy selectors kept for any old refs */
        .sidebar-brand-name { display: none; }
        .sidebar-brand-sub { display: none; }

        /* Nav menu */
        .sidebar-menu {
            list-style: none;
            padding: 8px 0;
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            z-index: 1;
        }

        .sidebar-menu::-webkit-scrollbar { width: 4px; }
        .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
        .sidebar-menu::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sidebar-menu li { margin: 1px 0; }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.1s ease, color 0.1s ease;
            white-space: nowrap;
            border-left: 3px solid transparent;
        }

        .sidebar-menu a:hover {
            background: var(--sidebar-hover);
            color: #ffffff;
        }

        .sidebar-menu a.active {
            background: var(--sidebar-active);
            color: var(--sidebar-active-text);
            border-left-color: var(--sidebar-active-border);
            font-weight: 600;
        }

        .sidebar-menu .icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-menu .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sidebar-menu .label {
            margin-left: 10px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-menu .label {
            opacity: 1;
        }

        .sidebar-section {
            padding: 14px 14px 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
            overflow: hidden;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 6px;
        }

        .sidebar:hover .sidebar-section { opacity: 1; }

        .station-badge {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 9px;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .sidebar-menu a:hover .station-badge,
        .sidebar-menu a.active .station-badge {
            background: rgba(90,163,194,0.28);
            color: #9cc8dc;
        }

        /* Footer / sign-out */
        .sidebar-footer {
            padding: 6px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            padding: 9px 14px;
            color: var(--sidebar-text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.1s ease, color 0.1s ease;
            white-space: nowrap;
            border-left: 3px solid transparent;
        }

        .sidebar-footer a:hover {
            background: var(--sidebar-hover);
            color: #ffffff;
        }

        .sidebar-footer .icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-footer .icon svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .sidebar-footer .label {
            margin-left: 10px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar:hover .sidebar-footer .label {
            opacity: 1;
        }

        /* Main Content */
        .main-content {
            margin-left: 48px;
            flex: 1;
            min-width: 0;
            max-width: calc(100vw - 48px);
            padding: 20px 28px 28px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Kill the seam between sidebar and main */
        .sidebar,
        .main-content { border: 0; }
        body { background-color: #1a2838; }  /* matches sidebar so any 1px gap blends */

        .page-header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .page-title {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 2px;
            letter-spacing: -0.2px;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 400;
        }

        /* Mobile hamburger button */
        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 1100;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .mobile-menu-btn svg { fill: #fff; width: 20px; height: 20px; }

        /* Mobile overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
        }
        .mobile-overlay.active { display: block; }

        /* Responsive breakpoints */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: flex; }

            .sidebar {
                transform: translateX(-100%);
                z-index: 1000;
                width: 220px !important;
                transition: transform 0.25s ease, width 0s;
            }
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            /* Show labels in mobile open state */
            .sidebar.mobile-open .label,
            .sidebar.mobile-open .sidebar-brand-wrap { display: block !important; opacity: 1 !important; }
            .sidebar.mobile-open .sidebar-logo { width: 32px; height: 32px; }

            .main-content {
                margin-left: 0 !important;
                padding: 56px 16px 16px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .main-content {
                padding: 20px 20px;
            }
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        {% block extra_styles %}{% endblock %}
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
    <!-- Mobile hamburger -->
    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <div class="mobile-overlay" id="mobile-overlay" onclick="closeMobileSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-wrap">
                <div class="sidebar-brand-one-line">MOC Automations</div>
            </div>
        </div>

        <ul class="sidebar-menu">
            <li>
                <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    </span>
                    <span class="label">Home</span>
                </a>
            </li>
            <li>
                <a href="{% url 'data_analysis' %}" class="{% if request.resolver_match.url_name == 'data_analysis' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    </span>
                    <span class="label">Data Analysis</span>
                </a>
            </li>
            <li>
                <a href="{% url 'sync_monitor' %}" class="{% if request.resolver_match.url_name == 'sync_monitor' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2v14H3v3c0 1.66 1.34 3 3 3h12c1.66 0 3-1.34 3-3V2l-1.5 1.5zM15 20H6c-.55 0-1-.45-1-1v-1h10v2zm4-1c0 .55-.45 1-1 1s-1-.45-1-1v-3H8V5h11v14z"/></svg>
                    </span>
                    <span class="label">Sync Monitor</span>
                </a>
            </li>
            <li>
                <a href="{% url 'user_list' %}" class="{% if request.resolver_match.url_name in 'user_list,user_create,user_edit' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    </span>
                    <span class="label">Users</span>
                </a>
            </li>
            <li>
                <a href="{% url 'useu_list' %}" class="{% if request.resolver_match.url_name == 'useu_list' or request.resolver_match.url_name == 'email_templates' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-5-7h-2v2H9v-2H7v-2h2V9h2v2h2v2z"/></svg>
                    </span>
                    <span class="label">US-EU List</span>
                </a>
            </li>
            <li>
                <a href="{% url 'automations_panel' %}" class="{% if request.resolver_match.url_name == 'automations_panel' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 1.45-.39 2.81-1.06 3.98l1.46 1.46C21.42 15.86 22 14 22 12c0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V3.03c-4.06.5-7.21 3.86-7.96 7.97h2.02A7.003 7.003 0 0012 19c1.45 0 2.81-.39 3.98-1.06l-1.46-1.46A4.98 4.98 0 0112 19zm7-7h2c0 2-0.58 3.86-1.6 5.44l-1.46-1.46A7.05 7.05 0 0019 12zM8 12l4 4 4-4h-3V8h-2v4H8z"/></svg>
                    </span>
                    <span class="label">Automations</span>
                </a>
            </li>
            <li>
                <a href="{% url 'settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                    <span class="icon">
                        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                    </span>
                    <span class="label">Settings</span>
                </a>
            </li>

        </ul>

        <div class="sidebar-footer">
            <a href="{% url 'logout' %}">
                <span class="icon">
                    <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                </span>
                <span class="label">Sign out</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}

    </main>

    <!-- Global responsive overrides — apply to all pages -->
    <style>
    /* Prevent code blocks from expanding page width */
    .query-box { max-width: 100%; overflow-x: auto; }
    .query-code { display: block; }
    .conn-string { word-break: break-all; max-width: 100%; }

    /* ── Dark mode global overrides (loaded after block extra_styles so they win) ── */
    [data-theme="dark"] .page-banner { background: #0f1923; }
    [data-theme="dark"] .banner-eyebrow { color: rgba(255,255,255,0.35); }
    [data-theme="dark"] .banner-subtitle { color: rgba(255,255,255,0.4); }
    [data-theme="dark"] .banner-stat-label { color: rgba(255,255,255,0.35); }

    [data-theme="dark"] .card { background: var(--surface); border-color: var(--border); }
    [data-theme="dark"] .card-header { border-color: var(--border); }
    [data-theme="dark"] .card-title { color: var(--text-primary); }
    [data-theme="dark"] .card-body { color: var(--text-primary); }

    [data-theme="dark"] .stat-card { background: var(--surface); border-color: var(--border); }
    [data-theme="dark"] .stat-label { color: var(--text-secondary); }
    [data-theme="dark"] .stat-value { color: #6cb4d8; }

    [data-theme="dark"] .project-card { background: var(--surface); border-color: var(--border); }
    [data-theme="dark"] .project-title { color: var(--text-primary); }
    [data-theme="dark"] .project-description { color: var(--text-secondary); }
    [data-theme="dark"] .project-stats { border-color: var(--border); }
    [data-theme="dark"] .project-icon { background: var(--surface2); }

    [data-theme="dark"] .section-label { color: var(--text-muted); }
    [data-theme="dark"] .page-subtitle { color: var(--text-secondary); }

    [data-theme="dark"] .info-row { border-color: var(--border); }
    [data-theme="dark"] .info-label { color: var(--text-secondary); }
    [data-theme="dark"] .info-value { color: var(--text-primary); }

    [data-theme="dark"] .sync-time { color: var(--text-primary); }
    [data-theme="dark"] .sync-date { color: var(--text-secondary); }
    [data-theme="dark"] .sync-schedule { color: var(--text-secondary); }
    [data-theme="dark"] .sync-badge { background: #1b3a1b; color: #6fcf6f; }
    [data-theme="dark"] .sync-status { background: var(--surface2); color: var(--text-secondary); }

    [data-theme="dark"] .monitor-card { background: var(--surface); border-color: var(--border); }
    [data-theme="dark"] .card-header { background: var(--surface2); border-color: var(--border); }
    [data-theme="dark"] .monitor-table th { color: var(--text-muted); border-color: var(--border); background: var(--surface2); }
    [data-theme="dark"] .monitor-table td { color: var(--text-primary); border-color: var(--border); }
[data-theme="dark"] .station-link { color: var(--text-primary); }
    [data-theme="dark"] .sync-time, [data-theme="dark"] .records-count { color: var(--text-primary); }
    [data-theme="dark"] .time-ago { color: var(--text-muted); }
    [data-theme="dark"] .msg-text { color: var(--text-muted); }

    [data-theme="dark"] .sync-panel { background: var(--surface); border-color: var(--border); }
    [data-theme="dark"] .sync-panel-label { color: #6cb4d8; }
    [data-theme="dark"] .sync-panel-count { color: var(--text-secondary); }
    [data-theme="dark"] .sync-bar-outer { background: var(--border); }
    [data-theme="dark"] .sync-bar-inner { background: #6cb4d8; }
    [data-theme="dark"] .sync-chip { background: var(--surface2); color: var(--text-secondary); }
    [data-theme="dark"] .refresh-bar-wrap { background: transparent; }
    [data-theme="dark"] .refresh-bar { background: #6cb4d8; }


    @media (max-width: 900px) {
        .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
        .stats-row { gap: 10px; }
        .stat-card { min-width: 0; flex: 1 1 calc(50% - 10px); }
        .page-title { font-size: 20px !important; }
        .page-subtitle { font-size: 12px !important; }
    }
    @media (max-width: 600px) {
        .stat-card { flex: 1 1 100%; }
        .stat-value { font-size: 18px !important; }
        .card-header { flex-wrap: wrap; gap: 6px; }
        .sync-row { flex-direction: column; align-items: flex-start !important; gap: 10px; }
        .info-row { flex-direction: column; gap: 2px; }
        .info-value { text-align: left !important; }
        .conn-string { font-size: 11px !important; word-break: break-all; }

    </style>

    {% block scripts %}{% endblock %}

    <script>
    function toggleMobileSidebar() {
        document.querySelector('.sidebar').classList.toggle('mobile-open');
        document.getElementById('mobile-overlay').classList.toggle('active');
    }
    function closeMobileSidebar() {
        document.querySelector('.sidebar').classList.remove('mobile-open');
        document.getElementById('mobile-overlay').classList.remove('active');
    }
    // Close sidebar when a nav link is tapped on mobile
    document.querySelectorAll('.sidebar-menu a, .sidebar-footer a').forEach(function(link) {
        link.addEventListener('click', function() {
            if (window.innerWidth <= 768) closeMobileSidebar();
        });
    });

    // Touchpoint Progress Auto-Update
    function updateTouchpointProgress() {
        // Get current TP type from the page
        const currentTP = document.querySelector('[data-tp-type]')?.dataset.tpType || 'tp1';
        
        fetch(`/api/tp-progress/?tp_type=${currentTP}`)
            .then(response => response.json())
            .then(data => {
                console.log('Progress update:', data); // Debug log
                const statusElement = document.querySelector('.tp-status');
                
                // Treat failed emails as sent (undeliverable = successfully dispatched)
                const actualSent = data.sent_count + data.failed_count;
                const actualFailed = 0; // Don't show any failures since undeliverable = sent
                
                if (statusElement && data.status === 'sending') {
                    statusElement.style.display = 'block';
                    const pct = data.total_contacts > 0 ? Math.round((actualSent / data.total_contacts) * 100) : 0;
                    statusElement.innerHTML = `
                        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                            <span style="display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
                            <strong>Sending ${currentTP.toUpperCase()}...</strong>
                            <span style="margin-left:auto;font-size:18px;font-weight:700;">${pct}%</span>
                        </div>
                        <div style="height:6px;background:rgba(255,255,255,0.2);border-radius:3px;overflow:hidden;margin-bottom:6px;">
                            <div style="height:100%;width:${pct}%;background:#fff;border-radius:3px;transition:width 0.5s;"></div>
                        </div>
                        <div style="font-size:12px;opacity:0.9;">
                            Sent <strong>${actualSent}</strong> of <strong>${data.total_contacts}</strong>
                            ${data.current_email ? ` &mdash; ${data.current_email}` : ''}
                        </div>
                    `;
                } else if (statusElement) {
                    console.log('Hiding status element, conditions not met');
                    statusElement.style.display = 'none';
                }
            })
            .catch(err => {
                console.error('Progress update error:', err);
                // Force display with error message
                const statusElement = document.querySelector('.tp-status');
                if (statusElement) {
                    statusElement.style.display = 'block';
                    statusElement.innerHTML = '<strong>⚠️ Unable to load progress status</strong>';
                }
            });
    }

    // Auto-refresh every 2 seconds if sending or has data
    setInterval(() => {
        const statusElement = document.querySelector('.tp-status');
        // Always update to check for new data
        updateTouchpointProgress();
    }, 3000);

    // Load progress on page load  
    document.addEventListener('DOMContentLoaded', () => {
        console.log('DOM loaded, starting progress update');
        updateTouchpointProgress();
    });
    
    </script>
</body>
</html>
