<div class="fluent-card" data-job-id="{{ job.id }}" data-status="{% if job.is_paused %}paused{% else %}active{% endif %}" data-kind="{{ kind }}">
    <div class="fluent-card-head">
        <div class="fluent-card-icon {{ kind }}">
            {% if kind == 'email' %}
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            {% elif kind == 'sync' %}
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            {% else %}
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.36 7.36 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.08 7.08 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.36 7.36 0 0 0 0 1.88L2.86 14.5a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.49.39 1.04.7 1.63.94l.36 2.54c.05.25.26.42.5.42h3.84c.25 0 .46-.17.5-.42l.36-2.54a7.08 7.08 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
            {% endif %}
        </div>
        <div class="fluent-status {% if job.is_paused %}paused{% else %}active{% endif %}">
            <span class="dot"></span>{% if job.is_paused %}Paused{% else %}Active{% endif %}
        </div>
    </div>
    <div class="fluent-card-body">
        <div class="fluent-card-name">{{ job.name }}</div>
        <div class="fluent-card-id">{{ job.id }}</div>
        <div class="fluent-card-meta">
            <div class="meta-row"><span class="meta-k">Interval</span><span class="meta-v">{{ job.trigger }}</span></div>
            <div class="meta-row"><span class="meta-k">Next run</span><span class="meta-v">{{ job.next_run }}</span></div>
        </div>
    </div>
    <div class="fluent-card-foot">
        {% if job.is_paused %}
        <button class="fluent-action primary" onclick="toggleJob('{{ job.id }}', 'resume')">Resume</button>
        {% else %}
        <button class="fluent-action" onclick="toggleJob('{{ job.id }}', 'pause')">Pause</button>
        {% endif %}
        <button class="fluent-action primary" onclick="toggleJob('{{ job.id }}', 'run_now')">Run now</button>
        <button class="fluent-action danger" onclick="removeJob('{{ job.id }}', '{{ job.name|escapejs }}')">Remove</button>
    </div>
</div>
